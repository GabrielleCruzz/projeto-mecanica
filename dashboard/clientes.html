<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <title>Clientes</title>
    <script src="../assets/js/sidebar.js" defer></script>
    <script src="../assets/js/orcamento.js" defer></script>
    <script src="../assets/js/global.js" defer></script>
    <!-- link para os ícones -->
    <link href="../assets/icons/css/fontawesome.css" rel="stylesheet" />
    <link href="../assets/icons/css/solid.css" rel="stylesheet" />
    <link href="../assets/icons/css/regular.css" rel="stylesheet" />
</head>

<body>

    <!-- menu -->
    <div id="menuContainer"></div>

    <div id="sidebarContainer"></div>

    <!-- conteúdo principal -->
    <main>

        <!-- título da página -->
        <div class="title">
            <h1>Clientes</h1>
            <p>Gerencie seus clientes e veículos</p>
        </div>

        <!-- barra de pesquisa de cliente -->
        <div class="buscar-add">
            <div class="pesquisa">
                <input class="input-pesquisa" type="text" placeholder="Buscar por nome, placa, telefone..." />
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>        
            <button class="btn-novo cadastrarCliente">+ Cadastrar cliente</button>
            <button class="add cadastrarCliente">+ Novo</button>
        </div>

        <!-- cards de informações de clientes -->
        <section>
            <div class="ordem-filtro ordem-clientes">
                <button type="button" class="ordem-btn">
                    <span>Exibindo mais recente</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="ordem-opcoes">
                    <button type="button">Exibindo mais recente</button>
                    <button type="button">Exibindo mais antigo</button>
                </div>
            </div>

            <div class="cards cards-clientes">
                <a href="#" class="cliente-card cliente-card-modelo">
                    <span class="info-destaque">Nome e Sobrenome do Cliente</span>
                    <div class="infos-sec">
                        <span class="info-secundaria">Telefone: <span class="destaque telefone">(11) 99999-9999</span></span>
                        <span class="info-secundaria destaque qt_veiculo">2 veículos vinculados</span>
                    </div>                
                    <span href="detalhes-cliente.html" class="ver-detalhes">Ver cliente</span>
                </a>
            </div>            
        </section>
    </main>

    <!-- Modal -->
    <!-- Formulário para cadastrar novo veículo -->
    <div class="overlay" id="modalAddCliente">
        <div class="modal modal-add-cliente">

            <form class="form-cliente form-add-cliente">
                <!-- Botão de fechar o formulário -->
                <button type="button" class="btn-fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <h1>Cadastrar Cliente</h1>

                <!--Dados do cliente-->
                <div class="campos-cliente">
                    <h2>Dados do cliente</h2>
                    <label>Nome</label>
                    <input type="text" required name="cliente_nome">

                    <label>Telefone</label>
                    <input type="tel" required name="cliente_tel">

                    <button class="btn-add-novo-tel">Adicionar novo</button>
                </div>

                <!--Dados do veículo-->
                <div class="campos-veiculo">
                    <h2>Veículos</h2>

                    <div class="infos-veiculo">
                        <div class="campo-placa">
                            <label>Placa</label>
                            <input type="text" required name="veiculo_placa">
                        </div>

                        <div class="campo-marca">
                            <label>Marca/Modelo</label>
                            <input type="text" required name="veiculo_marca_modelo">
                        </div>

                        <div class="campo-ano">
                            <label>Ano</label>
                            <input type="text" required name="veiculo_ano">
                        </div>
                    </div>

                    <button class="btn-adicionar-veiculo">Adicionar novo</button>
                </div>

                <div class="campo-textarea">
                    <label>Observações</label>
                    <textarea class="obs-cliente" name="veiculo_obs"></textarea>
                </div>

                <div class="btns-add-cliente">
                    <button class="btn-dell">Descartar</button>
                    <button type="submit" class="btn-salvar">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- menu inferior -->
    <div class="menuInferior">
        <a href="painel.html">
            <i class="fa-regular fa-house"></i>
            <span>Início</span>
        </a>
        <a href="orcamento.html">
            <i class="fa-solid fa-plus"></i>
            <span>Novo</span>
        </a>
        <a href="servicos.html">
            <i class="fa-regular fa-clipboard"></i>
            <span>Serviços</span>
        </a>
        <a href="clientes.html" class="atual">
            <i class="fa-solid fa-user"></i>
            <span>Clientes</span>
        </a>
    </div>

</body>

</html>
